	<!-- Animated send confirmation -->
	<div class="msg-toast" id="msgToast" role="status" aria-live="polite">
		<svg class="mc" viewBox="0 0 56 56"><circle cx="28" cy="28" r="26"/><path d="M16 29 l8 8 l16 -18"/></svg>
		<div class="mt"><b id="msgToastTitle">Message sent!</b><span id="msgToastSub">Thanks — I will get back to you soon.</span></div>
	</div>

	<script>
	(function(){
		var form = document.getElementById('msgForm');
		if(!form) return;
		var toast = document.getElementById('msgToast');
		var hideTimer;
		function showToast(ok, title, sub){
			toast.classList.toggle('error', !ok);
			document.getElementById('msgToastTitle').textContent = title;
			document.getElementById('msgToastSub').textContent = sub;
			toast.classList.remove('show'); void toast.offsetWidth; toast.classList.add('show');
			clearTimeout(hideTimer);
			hideTimer = setTimeout(function(){ toast.classList.remove('show'); }, 5500);
		}
		form.addEventListener('submit', function(e){
			e.preventDefault();
			if(form.querySelector('[name="_honey"]') && form.querySelector('[name="_honey"]').value) return;
			var btn = form.querySelector('[type="submit"]');
			var oldVal = btn ? btn.value : '';
			if(btn){ btn.value = 'Sending...'; btn.disabled = true; }
			var data = {};
			new FormData(form).forEach(function(v,k){
				if(k.charAt(0) !== '_' || k === '_subject' || k === '_template') data[k] = v;
			});
			fetch('https://formsubmit.co/ajax/tapli44@gmail.com', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
				body: JSON.stringify(data)
			})
			.then(function(r){ return r.json(); })
			.then(function(){
				showToast(true, 'Message sent!', 'Thanks — I will get back to you soon.');
				form.reset();
			})
			.catch(function(){
				showToast(false, 'Could not send', 'Please try again or email me directly.');
			})
			.then(function(){ if(btn){ btn.value = oldVal; btn.disabled = false; } });
		});
	})();
	</script>
